<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#b399f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="El Cielo" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Mi Español: El Cielo</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px system-ui,sans-serif;color:#6b4fa8;pointer-events:none">Cargando… ✦</div>
    <script>
      // If anything breaks while starting, show it on screen so a screenshot explains the problem.
      window.addEventListener('error', function (e) {
        var b = document.getElementById('boot');
        if (b) { b.style.pointerEvents = 'auto'; b.style.padding = '24px'; b.style.textAlign = 'center';
          b.textContent = 'Something went wrong: ' + (e.message || e) + ' — please send a screenshot.'; }
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
